global:
  scrape_interval: 10s

scrape_configs:
  - job_name: inference
    metrics_path: /metrics
    static_configs:
      - targets: ["inference:8001"]

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: stream_processor
    static_configs:
      - targets: ["stream-processor:9102"]

  - job_name: drift_monitor
    static_configs:
      - targets: ["drift-monitor:9105"]
