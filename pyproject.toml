[project]
name = "intelligent-predictive-maintenance-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn==1.9.0",
  "skops>=0.9",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "confluent-kafka>=2.5",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "prometheus-client>=0.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
