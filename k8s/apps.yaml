apiVersion: v1
kind: ConfigMap
metadata:
  name: pmp-config
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  TELEMETRY_TOPIC: machine-telemetry
  PREDICTIONS_TOPIC: machine-predictions
  INFERENCE_URL: http://inference:8001/predict
  REDIS_URL: redis://redis:6379/0
---
apiVersion: v1
kind: Secret
metadata:
  name: pmp-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://pmp:pmp@postgres:5432/pmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
spec:
  replicas: 2
  selector:
    matchLabels: {app: inference}
  template:
    metadata:
      labels: {app: inference}
    spec:
      containers:
        - name: inference
          image: YOUR_REGISTRY/predictive-maintenance:latest
          command: ["uvicorn", "services.inference.app:app", "--host", "0.0.0.0", "--port", "8001"]
          ports: [{containerPort: 8001}]
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          readinessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inference
spec:
  selector: {app: inference}
  ports: [{port: 8001, targetPort: 8001}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: inference}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-processor
spec:
  replicas: 2
  selector:
    matchLabels: {app: stream-processor}
  template:
    metadata:
      labels: {app: stream-processor}
    spec:
      containers:
        - name: stream-processor
          image: YOUR_REGISTRY/predictive-maintenance:latest
          command: ["python", "-m", "services.stream_processor.app"]
          envFrom: [{configMapRef: {name: pmp-config}}]
          ports: [{containerPort: 9102}]
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1", memory: "768Mi"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistence
spec:
  replicas: 1
  selector:
    matchLabels: {app: persistence}
  template:
    metadata:
      labels: {app: persistence}
    spec:
      containers:
        - name: persistence
          image: YOUR_REGISTRY/predictive-maintenance:latest
          command: ["python", "-m", "services.persistence.app"]
          envFrom:
            - configMapRef: {name: pmp-config}
            - secretRef: {name: pmp-secrets}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: backend
          image: YOUR_REGISTRY/predictive-maintenance:latest
          command: ["uvicorn", "services.backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef: {name: pmp-config}
            - secretRef: {name: pmp-secrets}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: backend}
  ports: [{port: 8000, targetPort: 8000}]
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
spec:
  replicas: 1
  selector:
    matchLabels: {app: simulator}
  template:
    metadata:
      labels: {app: simulator}
    spec:
      containers:
        - name: simulator
          image: YOUR_REGISTRY/predictive-maintenance:latest
          command: ["python", "-m", "services.simulator.app"]
          envFrom: [{configMapRef: {name: pmp-config}}]
          env:
            - {name: SIMULATOR_MACHINES, value: "50"}
            - {name: SIMULATOR_EVENTS_PER_SECOND, value: "30"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-monitor
spec:
  replicas: 1
  selector:
    matchLabels: {app: drift-monitor}
  template:
    metadata:
      labels: {app: drift-monitor}
    spec:
      containers:
        - name: drift-monitor
          image: YOUR_REGISTRY/predictive-maintenance:latest
          command: ["python", "-m", "services.drift_monitor.app"]
          envFrom:
            - configMapRef: {name: pmp-config}
            - secretRef: {name: pmp-secrets}
          env:
            - {name: DRIFT_CHECK_SECONDS, value: "60"}
            - {name: DRIFT_SAMPLE_SIZE, value: "1000"}
